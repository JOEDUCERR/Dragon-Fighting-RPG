<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dragon Repeller — An RPG Adventure</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div id="game">
            <h1 id="title">🐉 Dragon Repeller</h1>

            <div id="stats">
                <span class="stat">Level: <strong><span id="levelText">1</span></strong></span>
                <span class="stat">XP: <strong><span id="xpText">0</span></strong>/<span id="xpNeededText">20</span></span>
                <span class="stat">Health: <strong><span id="healthText">100</span></strong>/<span id="maxHealthText">100</span></span>
                <span class="stat">Gold: <strong><span id="goldText">50</span></strong></span>
                <div class="bar-wrap"><div id="healthBar"></div></div>
            </div>

            <div id="monsterStats">
                <span class="stat">👹 <strong><span id="monsterName"></span></strong> <small>(Lv <span id="monsterLevel"></span>)</small></span>
                <span class="stat">Health: <strong><span id="monsterHealth"></span></strong></span>
                <div class="bar-wrap"><div id="monsterHealthBar"></div></div>
            </div>

            <div id="controls">
                <button id="button1">Go to store</button>
                <button id="button2">Visit tavern</button>
                <button id="button3">Go to cave</button>
                <button id="button4">Go to forest</button>
            </div>

            <div id="text">Welcome to Dragon Repeller. A terrible dragon has been terrorizing the
                town and has sealed every road out of the valley. You are in the town square.
                Where do you want to go? Use the buttons above.
            </div>

            <div id="inventory"></div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
